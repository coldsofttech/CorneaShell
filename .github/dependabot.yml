version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /examples/react_vite
      - /examples/vue_vite
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      examples-npm:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /examples/go_server
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: nuget
    directory: /examples/dotnet_server
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
