name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: For anything the page could do on the machine, say how it would stay off by default.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Window
        - Native actions or notifications
        - Web sources and the proxy
        - Security
        - Command line
        - Packaging
        - Examples or docs
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
