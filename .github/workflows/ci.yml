name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and the generated-docs checks run on Linux: they are fast, and they prove that the package
  # imports and generates its docs without pywebview, which is only installed on Windows.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Check the generated CLI reference is up to date
        run: |
          uv run python scripts/gen_cli_reference.py
          git diff --exit-code docs/cli-reference.md
      - name: Check the generated API reference is up to date
        run: |
          uv run python scripts/gen_api_reference.py
          git diff --exit-code docs/api-reference.md
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest # covered by the test job across all Python versions

  # Cornea shows a Windows window, so everything that runs it is tested on Windows.
  test:
    name: test (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-group hooks
      # --no-sync: `uv run` would otherwise install the default groups again.
      - run: uv run --no-sync pytest

  # Runs real processes and a real window. The window test skips itself if the runner has no
  # WebView2 runtime.
  integration:
    name: integration (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-group hooks
      - run: uv run --no-sync pytest -m integration --no-cov -rs

  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke test the built wheel
        # bash expands the dist/*.whl glob; PowerShell would pass it on unexpanded.
        shell: bash
        run: |
          uvx --from dist/*.whl cornea --version
          # A clean environment with only the wheel: its declared dependencies must be enough,
          # including pywebview on Windows.
          uv run --no-project --isolated --with dist/*.whl python -c "import cornea, webview; print(cornea.__version__)"

  # Single required status check for the branch ruleset.
  ci:
    if: always()
    needs: [lint, test, integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "test:        ${{ needs.test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "build:       ${{ needs.build.result }}"
          [ "${{ needs.lint.result }}" = success ] &&
          [ "${{ needs.test.result }}" = success ] &&
          [ "${{ needs.integration.result }}" = success ] &&
          [ "${{ needs.build.result }}" = success ]
