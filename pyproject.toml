[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cornea-shell"
dynamic = ["version"]
description = "Host a web UI in a native window backed by a secured local server."
keywords = ["cli", "webview", "desktop", "fastapi"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "coldsofttech" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.162.0",
    "pywebview>=5.3 ; sys_platform == 'win32'",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
cornea = "cornea.cli:run"

[project.urls]
Homepage = "https://github.com/coldsofttech/CorneaShell"
Issues = "https://github.com/coldsofttech/CorneaShell/issues"
Changelog = "https://github.com/coldsofttech/CorneaShell/blob/main/CHANGELOG.md"
Documentation = "https://github.com/coldsofttech/CorneaShell/tree/main/docs"

[project.optional-dependencies]
wsgi = [
    "a2wsgi>=1.10.10",
]
proxy = [
    "httpx>=0.28.1",
    "websockets>=17.4",
]
notifications = [
    "winrt-runtime>=3 ; sys_platform == 'win32'",
    "winrt-windows-data-xml-dom>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-ui-notifications>=4!10.0.28000.2957 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "a2wsgi>=1.10.10",
  "django>=5.2.18",
  "flask>=3.1.3",
  "httpx>=0.28.1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
  "websockets>=17.4",
]
examples = [
    "jinja2>=3.1.6",
    "mkdocs>=1.6.1",
    "streamlit>=1.66.1",
]
hooks = [
  "pre-commit>=4.7.0",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# `uv sync` installs both. CI test jobs skip `hooks`: pre-commit needs PyYAML, which can lack a
# Windows wheel for the newest Python, and they do not run the hooks.
default-groups = ["dev", "hooks"]

[tool.hatch.version]
path = "src/cornea/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cornea"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]  # assert and subprocess are fine in tests
"scripts/**" = ["S603", "S607", "T201"]  # scripts call the trusted gh CLI and print progress

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Only installed with the optional "notifications" extra, so it is not there in a plain `uv sync`.
module = ["winrt", "winrt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not toolchains' --strict-markers --cov=cornea --cov-report=term-missing --cov-fail-under=80"
markers = [
  "integration: slower end-to-end tests, run in CI but not by default or in pre-commit",
  "toolchains: examples that need Go, PHP, Java, .NET, Node, Streamlit or MkDocs; run by the examples workflow",
]

[tool.coverage.run]
branch = true
